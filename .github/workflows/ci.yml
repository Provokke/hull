name: ci
on: [push, pull_request]
jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y busybox-static
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # Privileged tests print SKIPPED here (no HULL_PRIVILEGED_TESTS).
      - run: cargo test
  privileged:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y busybox-static iproute2
      - run: cargo test --no-run
      # GitHub runners use cgroup v2; this exercises the v2 code path.
      - run: sudo -E env "PATH=$PATH" HULL_PRIVILEGED_TESTS=1 cargo test --test privileged -- --test-threads=2
