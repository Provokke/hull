[package]
name = "hull"
version = "0.1.0"
edition = "2021"
description = "A small, original Linux container runtime built directly on namespaces, cgroups and overlayfs"
license = "MIT"

[dependencies]
libc = "0.2"
nix = { version = "0.29", features = ["sched", "mount", "signal", "process", "fs", "hostname", "user", "dir", "ioctl", "net", "socket"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
flate2 = "1"

[dev-dependencies]
proptest = "1"

[profile.release]
opt-level = 3
